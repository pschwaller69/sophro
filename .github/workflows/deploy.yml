name: Déploiement sur o2switch

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la syntaxe PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Créer config.local.php (mot de passe admin chiffré)
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SITE_URL: ${{ vars.SITE_URL || 'https://sophro.schwaller.fr' }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then echo "::error::Le secret ADMIN_PASSWORD est manquant"; exit 1; fi
          php -r '$c = ["site_url" => getenv("SITE_URL"), "admin_password_hash" => password_hash(getenv("ADMIN_PASSWORD"), PASSWORD_DEFAULT)];
                  file_put_contents("config.local.php", "<?php\nreturn " . var_export($c, true) . ";\n");'

      - name: Envoyer les fichiers par FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ vars.FTP_DIR || 'sophro.schwaller.fr/' }}
          # Les contenus créés par l'admin (base et fichiers envoyés) ne sont jamais touchés
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tools/**
            README.md
            data/*.sqlite*
            uploads/**
